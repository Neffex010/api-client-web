<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Web API Client</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <h1>Mini Postman Web</h1>
        <div class="request-bar">
            <select id="method">
                <option value="GET">GET</option>
                <option value="POST">POST</option>
                <option value="PUT">PUT</option>
                <option value="DELETE">DELETE</option>
            </select>
            <input type="text" id="url" placeholder="https://api.ejemplo.com/v1/recurso" />
            <button id="send-btn">Enviar</button>
        </div>

        <div class="panes">
            <div class="pane">
                <h3>Headers (JSON)</h3>
                <textarea id="headers" placeholder='{"Content-Type": "application/json"}'></textarea>
                <h3>Body (JSON)</h3>
                <textarea id="body" placeholder='{"key": "value"}'></textarea>
            </div>
            <div class="pane">
                <h3>Respuesta</h3>
                <div id="status-info"></div>
                <pre><code id="response-output">Respuesta aparecerá aquí...</code></pre>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>

</html>
